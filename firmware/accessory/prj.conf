# Stealth Bonding Accessory — GAP adapter on stock Zephyr.
# LE SC + Just Works (NoInputNoOutput). Not CONFIG_BT_SMP_SC_ONLY (level 4).

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_DEVICE_NAME="SB Accessory"
CONFIG_BT_DEVICE_APPEARANCE=0

CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
