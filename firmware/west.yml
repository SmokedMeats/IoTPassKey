# West manifest for the Accessory firmware tree.
# From the git root: west init -l firmware && west update

manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import:
        name-allowlist:
          - cmsis_6
          - hal_nordic
          - mbedtls
          - tinycrypt
          - segger
